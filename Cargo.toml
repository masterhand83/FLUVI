[workspace]
members = ["crates/ca-core", "crates/ca-gpu", "crates/ca-analysis", "crates/ca-app", "tools/ca-dev"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
ca-core = { path = "crates/ca-core" }
ca-gpu = { path = "crates/ca-gpu" }
eframe = { version = "=0.33.3", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "=0.33.3"
egui-wgpu = "=0.33.3"
wgpu = "=27.0.1"
puffin = "=0.20.0"
puffin_egui = "=0.30.0"
bytemuck = { version = "=1.25.2", features = ["derive"] }
crossbeam-channel = "=0.5.17"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
anyhow = "=1.0.105"
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
thiserror = "=2.0.21"
pollster = "=1.0.3"
rfd = { version = "=0.18.0", default-features = false, features = ["xdg-portal"] }
icu_collator = "=2.4.0"
icu_locale_core = "=2.4.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
base64 = "=0.22.1"
time = "=0.3.55"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
resvg = { version = "=0.50.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }
data-url = "=0.3.2"
zip = { version = "=2.4.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
# Balance development build time with usable wgpu runtime performance.
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
