appId: org.fluvi.desktop
productName: FLUVI
executableName: FLUVI
asar: true
afterPack: scripts/verify-payload.mjs
directories:
  output: dist/release
files:
  - main.mjs
  - server.mjs
  - package.json
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: FLUVI-${version}-windows-x64-portable.${ext}
portable:
  requestExecutionLevel: user
linux:
  target:
    - AppImage
    - deb
  category: Education
  syncDesktopName: true
  maintainer: FLUVI contributors
  artifactName: FLUVI-${version}-linux-x64.${ext}
mac:
  target:
    - dmg
    - zip
  category: public.app-category.education
  artifactName: FLUVI-${version}-macos-${arch}.${ext}
